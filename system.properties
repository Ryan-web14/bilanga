# ============================================================
# Version de la JVM demandée au buildpack Heroku.
#
# Sans ce fichier, le buildpack Java retient sa version PAR DÉFAUT — une LTS
# ancienne. Le projet cible Java 25 (pom.xml : <java.version>25</java.version>)
# et emploie des constructions récentes : la compilation échouerait au déploiement
# avec une erreur de version de classe, très loin de sa cause apparente.
#
# ⚠️ À VÉRIFIER AU PREMIER DÉPLOIEMENT. Si le buildpack refuse la valeur 25, il
# le dit explicitement dans le journal de build (« Unsupported Java version »).
# Deux issues alors, par ordre de préférence :
#   1. rétrograder ce fichier ET pom.xml sur la dernière version acceptée ;
#   2. déployer en conteneur (heroku.yml + Dockerfile), qui affranchit du
#      catalogue du buildpack au prix d'une image à entretenir.
#
# Ne PAS rétrograder ce seul fichier en laissant pom.xml sur 25 : le build
# passerait et le démarrage échouerait, ce qui est le pire des deux mondes.
# ============================================================
java.runtime.version=25
