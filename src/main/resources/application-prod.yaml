# ============================================================
# Profil PROD
#
# Aucune valeur par défaut pour ce qui est sensible : tout vient de
# l'environnement. Une variable oubliée doit empêcher le démarrage, pas
# faire tourner le service avec un secret de développement — c'est
# précisément le risque que créait l'absence de profils, où le secret JWT
# codé en dur s'appliquait partout sans que rien ne le signale.
#
# Le contrôle est fait par ConfigurationGuard, qui refuse le démarrage si un
# secret est vide, trop court, ou égal à une valeur de développement connue.
# ============================================================

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  dev-mode: false
  error:
    verbose: false

  security:
    # En production, aucune route métier n'est ouverte par défaut : chaque appel
    # est confronté à la matrice de AdminApiAuthorizationManager.
    #
    # ⚠️ DÉSORMAIS SURCHARGEABLE (2026-07-30). La valeur était codée en dur, au
    # motif qu'une variable oubliée ne devait pas rouvrir l'API entière. Le
    # revers : aucun moyen de débloquer une démonstration où le frontend n'émet
    # pas encore de jeton, sinon un redéploiement.
    #
    # Le défaut reste FERMÉ — rien ne change sans geste explicite. Mais si tout
    # répond 403 le jour de la soutenance, c'est le levier :
    #   heroku config:set APP_SECURITY_OPEN_BUSINESS_ROUTES=true
    #
    # Ce qu'il ouvre : toutes les routes métier, sans autorisation. Seuls les
    # @PreAuthorize des contrôleurs d'administration protègent encore.
    open-business-routes:
      enabled: ${APP_SECURITY_OPEN_BUSINESS_ROUTES:false}

    # Auto-admin refusé : ConfigurationGuard empêche déjà le démarrage s'il est
    # actif ici, mais le poser à false rend l'intention explicite plutôt que
    # dépendante d'un contrôle.
    auto-admin:
      enabled: false

    # Redondant — DefaultAdminSeeder porte @Profile("dev") et n'existe donc pas
    # ici. Posé quand même à false, et NON surchargeable par l'environnement :
    # l'intention doit se lire dans le fichier, pas se déduire d'une annotation
    # qu'on pourrait élargir un jour sans mesurer ce qu'on ouvre.
    #
    # En production, le premier compte se crée par
    # POST /admin/provisioning/bootstrap-admin, avec un mot de passe choisi par
    # l'opérateur et jamais écrit dans le dépôt.
    bootstrap-admin:
      enabled: false

    # Cloisonnement par propriétaire. Actif par défaut en production, mais
    # surchargeable pour la même raison que ci-dessus : il suppose que chaque
    # parcelle a un propriétaire en base et que l'appelant est authentifié.
    # Sur un jeu de démonstration incomplet, il masque tout.
    #   heroku config:set APP_SECURITY_OWNERSHIP_ENABLED=false
    ownership:
      enabled: ${APP_SECURITY_OWNERSHIP_ENABLED:true}

    # ⚠️ OUVERT À TOUTE ORIGINE — décision du 2026-07-30, pour la soutenance.
    #
    # Cette clé n'avait AUCUNE valeur par défaut : un placeholder non résolu
    # faisait échouer Spring sur « Could not resolve placeholder », avant même
    # que ConfigurationGuard ne s'exécute — donc sans le message qui aurait
    # expliqué quoi faire. C'était le premier blocage au démarrage, et le plus
    # déroutant.
    #
    # allowCredentials reste false : le navigateur ne joint aucun cookie ni
    # en-tête d'authentification implicite, et une page tierce ne peut donc pas
    # rejouer la session de quelqu'un. C'est ce qui rend « * » tolérable ici.
    #
    # À REFERMER avant tout usage réel : APP_CORS_ALLOWED_ORIGINS=https://…
    cors:
      allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGINS:*}

    # ⚠️⚠️ SECRETS DE DÉMONSTRATION — LISEZ CECI AVANT DE VOUS EN SERVIR.
    #
    # Ces valeurs par défaut existent pour qu'un déploiement démarre sans
    # configuration préalable. Elles sont dans un dépôt PUBLIC.
    #
    # Conséquence concrète, et elle n'est pas théorique : quiconque lit ce
    # fichier peut FORGER un jeton d'accès valide, pour n'importe quel compte,
    # y compris administrateur. Le secret est la seule chose qui distingue un
    # jeton émis par le serveur d'un jeton fabriqué.
    #
    # Elles conviennent à une soutenance sur des données de démonstration.
    # Elles ne conviennent à RIEN d'autre.
    #
    # Pour fermer — deux commandes, aucun changement de code :
    #   heroku config:set APP_JWT_SECRET="$(openssl rand -base64 48)"
    #   heroku config:set TOKEN_HASH_SECRET="$(openssl rand -base64 48)"
    jwt:
      secret: ${APP_JWT_SECRET:bilanga-demo-jwt-secret-soutenance-2026-a-remplacer-avant-tout-usage-reel}
    token-hash:
      secret: ${TOKEN_HASH_SECRET:bilanga-demo-token-hash-secret-soutenance-2026-a-remplacer}

bilanga:
  ingest:
    # ⚠️ Clé de démonstration, même réserve que les secrets ci-dessus : elle est
    # publique. Quiconque la lit peut déposer des relevés fabriqués sur
    # n'importe quelle parcelle — et chaque relevé déclenche un diagnostic, donc
    # potentiellement une alerte.
    #
    # Sans valeur par défaut, le démarrage était refusé en production.
    #   heroku config:set BILANGA_INGEST_DEVICE_KEY="$(openssl rand -hex 24)"
    device-key: ${BILANGA_INGEST_DEVICE_KEY:bilanga-demo-device-key-soutenance-2026}

    # Pilotable, comme demandé — mais ConfigurationGuard journalise un
    # avertissement appuyé si l'authentification est levée ici.
    require-device-key: ${BILANGA_INGEST_REQUIRE_DEVICE_KEY:true}

# La documentation décrit l'intégralité de la surface d'API, y compris les
# routes d'administration. Utile en développement, inutile à exposer en
# production — où elle sert surtout à qui cherche par où entrer.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

logging:
  level:
    root: WARN
    com.sni.bilanga: INFO
    org.hibernate.SQL: WARN
