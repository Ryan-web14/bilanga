<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bilanga — Nouveau mot de passe</title>
    <!--
      Styles en ligne uniquement : la CSP posée par PasswordResetFormController
      n'autorise ni feuille externe, ni police distante, ni script sans nonce.
      Une page de réinitialisation ne doit dépendre d'aucune ressource tierce.
    -->
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
            background: #f4f6f4; padding: 1.5rem;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #1c2b21;
        }
        .card {
            background: #fff; width: 100%; max-width: 27rem;
            border-radius: 12px; padding: 2rem;
            box-shadow: 0 2px 16px rgba(28, 43, 33, .10);
        }
        h1 { margin: 0 0 .35rem; font-size: 1.3rem; }
        .lead { margin: 0 0 1.5rem; color: #5a6b60; font-size: .93rem; line-height: 1.5; }
        label { display: block; margin-bottom: .35rem; font-size: .87rem; font-weight: 600; }
        input[type=password] {
            width: 100%; padding: .7rem .8rem; margin-bottom: 1.1rem;
            border: 1px solid #c9d4cc; border-radius: 7px;
            font-size: 1rem; font-family: inherit; background: #fff; color: inherit;
        }
        input[type=password]:focus { outline: 2px solid #2f7d4f; outline-offset: 1px; border-color: #2f7d4f; }
        button {
            width: 100%; padding: .8rem; border: 0; border-radius: 7px;
            background: #2f7d4f; color: #fff; font-size: 1rem; font-weight: 600;
            font-family: inherit; cursor: pointer;
        }
        button:hover { background: #276a43; }
        .error {
            background: #fdeaea; border-left: 3px solid #c0392b; color: #8e2b21;
            padding: .7rem .85rem; border-radius: 5px;
            margin-bottom: 1.2rem; font-size: .88rem; line-height: 1.45;
        }
        .hint { margin: 0; color: #77877c; font-size: .8rem; line-height: 1.5; }
    </style>
</head>
<body>
<main class="card">
    <h1>Nouveau mot de passe</h1>
    <p class="lead">Choisissez un mot de passe pour votre compte Bilanga.</p>

    <div class="error" th:if="${error}" th:text="${error}" role="alert"></div>

    <form method="post" th:action="@{/sni/api/v1/auth/password-reset/form}">
        <input type="hidden" name="token" th:value="${token}">
        <input type="hidden" name="_csrf" th:value="${_csrf}">

        <label for="newPassword">Nouveau mot de passe</label>
        <input type="password" id="newPassword" name="newPassword"
               required autocomplete="new-password" autofocus>

        <label for="confirmPassword">Confirmation</label>
        <input type="password" id="confirmPassword" name="confirmPassword"
               required autocomplete="new-password">

        <button type="submit">Enregistrer</button>
    </form>

    <p class="hint">Ce lien n'est utilisable qu'une fois et expire après un délai limité.</p>
</main>
</body>
</html>
