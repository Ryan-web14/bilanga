<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bilanga · Lien invalide</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
            background: #f4f6f4; padding: 1.5rem;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #1c2b21;
        }
        .card {
            background: #fff; width: 100%; max-width: 27rem;
            border-radius: 12px; padding: 2rem; text-align: center;
            box-shadow: 0 2px 16px rgba(28, 43, 33, .10);
        }
        .mark {
            width: 3rem; height: 3rem; margin: 0 auto 1.1rem;
            border-radius: 50%; background: #fdeaea; color: #c0392b;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; font-weight: 700;
        }
        h1 { margin: 0 0 .6rem; font-size: 1.25rem; }
        p { margin: 0 0 1rem; color: #5a6b60; font-size: .92rem; line-height: 1.55; }
        .hint { margin: 0; color: #77877c; font-size: .82rem; }
    </style>
</head>
<body>
<main class="card">
    <div class="mark" aria-hidden="true">!</div>
    <h1>Lien inutilisable</h1>

    <!-- Le motif vient du contrôleur : il distingue un jeton absent,
         expiré, ou déjà consommé. -->
    <p th:text="${reason}">Ce lien de réinitialisation n'est plus valable.</p>

    <p class="hint">
        Demandez un nouveau lien depuis l'écran de connexion, puis ouvrez-le
        depuis le message le plus récent.
    </p>
</main>
</body>
</html>
